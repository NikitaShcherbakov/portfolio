name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also on push: a pull request opened by the open-pull-request workflow
      # (GITHUB_TOKEN) starts no pull_request run for its first commits
      - env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from=$PR_BASE
            to=$PR_HEAD
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            from=$(git merge-base origin/main "$PUSH_AFTER")
            to=$PUSH_AFTER
          else
            from=$PUSH_BEFORE
            to=$PUSH_AFTER
          fi
          # commitlint exits 9 on an empty range (a branch pushed with no commits of its own)
          if [ "$(git rev-parse "$from")" = "$(git rev-parse "$to")" ]; then
            echo "No commits to lint"
            exit 0
          fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

  checks:
    name: Format, lint, types, dead code, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
