version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    # pnpm refuses versions younger than its minimumReleaseAge
    # (ERR_PNPM_NO_MATURE_MATCHING_VERSION), so propose only week-old releases
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch updates; majors come one by one.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: monthly
